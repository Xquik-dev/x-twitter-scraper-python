name: CI
on:
  push:
    branches:
      - '**'
      - '!integrated/**'
      - '!stl-preview-head/**'
      - '!stl-preview-base/**'
      - '!generated'
      - '!codegen/**'
      - 'codegen/stl/**'
  pull_request:
    branches-ignore:
      - 'stl-preview-head/**'
      - 'stl-preview-base/**'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    timeout-minutes: 15
    name: Lint & Licensing
    runs-on: ubuntu-24.04
    if: github.event_name == 'pull_request' || github.event.head_commit.message != 'codegen metadata'
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: false
          version: "0.12.13"

      - name: Install dependencies
        run: uv sync --locked --all-extras

      - name: Run lints
        run: ./scripts/lint

      - name: Check licensing
        uses: fsfe/reuse-action@676e2d560c9a403aa252096d99fcab3e1132b0f5 # v6.0.0

  build:
    if: github.event_name == 'pull_request' || github.event.head_commit.message != 'codegen metadata'
    timeout-minutes: 10
    name: Build & Reproducibility
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: false
          version: "0.12.13"

      - name: Verify reproducible distributions
        run: ./scripts/check-reproducible

      - name: Build distributions
        run: SOURCE_DATE_EPOCH=946684800 uv build

      - name: Check package metadata
        run: uv run --locked --all-extras twine check dist/*

  test:
    timeout-minutes: 20
    name: Tests & Coverage
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: false
          version: "0.12.13"

      - name: Bootstrap
        run: ./scripts/bootstrap

      - name: Run tests
        run: ./scripts/test

      - name: Measure parent coverage
        id: parent
        run: bash scripts/coverage-parent HEAD^

      - name: Enforce coverage
        env:
          PARENT_REPORT: ${{ steps.parent.outputs.report }}
          PARENT_REVISION: ${{ steps.parent.outputs.revision }}
        run: bash scripts/coverage "$PARENT_REPORT" "$PARENT_REVISION"

  security:
    timeout-minutes: 15
    name: Dependency Security
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: false
          version: "0.12.13"

      - name: Audit locked dependencies
        run: ./scripts/audit
